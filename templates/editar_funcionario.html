{% extends "base.html" %}
{% block titulo %}Editar funcionário{% endblock %}
{% block conteudo %}
<h1>Editar funcionário</h1>
<section>
  <form method="post" class="grade">
    <label>Nome <input name="nome" maxlength="80" value="{{ pessoa.nome }}" required></label>
    <label>Cargo <input name="cargo" maxlength="80" value="{{ pessoa.cargo }}" required></label>
    <button>Salvar</button>
  </form>
</section>
{% endblock %}
